<text x="60" y="1090" font-size="11" font-weight="bold" fill="#111">LEGEND</text>
<text x="60" y="1110" font-size="9.5" fill="#333">Arrowhead = type of action.   Filled triangle: conversion.   Open triangle: stimulation.   Bar: inhibition.   Open circle: catalysis.   Triangle with bar: transcriptional regulation.</text>
<text x="60" y="1130" font-size="9.5" fill="#333">Solid line / solid box = main pathway (context fit C1-C2, evidence E1-E3).   Broken line / broken box = candidate pathway (other system, or association only).</text>
<text x="60" y="1150" font-size="9.5" fill="#333">Boxes = subcellular compartment. The nucleus is drawn twice; both regions are the same compartment.</text>
<text x="60" y="1170" font-size="9.5" fill="#333">Rna nodes are gene-product-level functional summaries. mRNA-to-protein edges are not measured translation steps.</text>
<text x="60" y="1190" font-size="9.5" fill="#333">'S' mark on NRF2 = SUMO conjugation, removed by SENP3 (reaction R006). Helper factors attach to the midpoint of the reaction they assist.</text>
<text x="60" y="1210" font-size="9.5" fill="#333">Node outline colour only mirrors the biological type label; no meaning depends on colour alone.</text>
<text x="60" y="1234" font-size="9.5" fill="#333">Reading order: start at the top (MYC, FOXO3, GDF15), follow down to NRF2 in the middle, then to the target genes and the phenotype row at the bottom.</text>
<rect x="70" y="1250" width="16" height="13" rx="2" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/>
