<text x="532" y="1260" font-size="9.5" fill="#333">Phenotype (Pathway)</text>
<text x="630" y="28" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">NRF2 signalling in colorectal cancer malignant progression (baseline map, Homo sapiens)</text>
